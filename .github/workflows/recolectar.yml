name: Recolectar datos BiZi
on:
  workflow_dispatch:
jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
        name: Run requirements
      - run: python src/snapshots.py
        name: Run Workflow
